{% load static %}

<!-- =========================================================
     GOOGLE / BING SEO
========================================================= -->

<!-- PAGE TITLE -->
<title>{{ seo_title }}</title>

<!-- META DESCRIPTION -->
<meta
    name="description"
    content="{{ seo_description }}"
>

<!-- SEARCH ENGINE ROBOTS -->
<meta
    name="robots"
    content="index, follow"
>

<!-- CANONICAL URL -->
<link
    rel="canonical"
    href="{{ seo_canonical }}"
>


<!-- =========================================================
     OPEN GRAPH
========================================================= -->

<meta
    property="og:title"
    content="{{ seo_title }}"
>

<meta
    property="og:description"
    content="{{ seo_description }}"
>

<meta
    property="og:type"
    content="{{ seo_type|default:'website' }}"
>

<meta
    property="og:url"
    content="{{ seo_canonical }}"
>

<meta
    property="og:image"
    content="{{ seo_image|default:'https://wingastock.onrender.com/static/logo.png' }}"
>


<!-- =========================================================
     FAVICON
========================================================= -->

<link
    rel="icon"
    href="{% static 'logo.png' %}"
    type="image/png"
>


<!-- =========================================================
     GOOGLE SEARCH CONSOLE VERIFICATION
========================================================= -->

<meta
    name="google-site-verification"
    content="cBo6MO_R0NHmkbNtZ4TbAd5KcLYgqPdt0XB-BgMYi1o"
>


<!-- =========================================================
     BING WEBMASTER TOOLS VERIFICATION
========================================================= -->

<meta
    name="msvalidate.01"
    content="24C554194C77E0084DA5450B14850A0F"
>

     GOOGLE ANALYTICS - GA4
========================================================= -->
