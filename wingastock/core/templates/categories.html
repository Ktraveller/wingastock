{% load static %}
{% load humanize %}
{% load i18n %}

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% translate "Wingastock | Categories" %}
    </title>


    <!-- =================================================
         FONT AWESOME
    ================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    >


    <!-- =================================================
         CSS
    ================================================== -->

    <link
        rel="stylesheet"
        href="{% static 'css/home.css' %}"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/search.css' %}"
    >


    <link
        rel="shortcut icon"
        href="{% static 'logo.png' %}"
        type="image/x-icon"
    >

</head>


<body>


<div class="search-page">


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="search-header">


        <!-- BACK -->

        <button
            type="button"
            class="back-button"
            onclick="history.back()"
            aria-label="{% translate 'Go back' %}"
        >

            <i class="fas fa-arrow-left"></i>

        </button>



        <!-- TITLE -->

        <h1>
            {% translate "Categories" %}
        </h1>



        <!-- CATEGORY OPTIONS -->

        <div class="search-options">


            <button
                type="button"
                class="search-options-button"
                id="searchOptionsButton"
                aria-label="{% translate 'Category options' %}"
            >

                <i class="fas fa-ellipsis-v"></i>

            </button>



            <div
                class="search-options-dropdown"
                id="searchOptionsDropdown"
            >


                <!-- CATEGORY HISTORY -->

                <button
                    type="button"
                    class="search-option"
                    id="searchHistoryButton"
                >

                    <span class="search-option-icon">

                        <i class="fas fa-history"></i>

                    </span>


                    <span class="search-option-text">

                        <strong>
                            {% translate "Category history" %}
                        </strong>

                        <small>
                            {% translate "View your recently viewed categories" %}
                        </small>

                    </span>

                </button>



                <!-- REQUEST PRODUCT -->

                <button
                    type="button"
                    class="search-option"
                    id="requestProductButton"
                >

                    <span class="search-option-icon">

                        <i class="fas fa-box-open"></i>

                    </span>


                    <span class="search-option-text">

                        <strong>
                            {% translate "Request product" %}
                        </strong>

                        <small>
                            {% translate "Can't find a product you need?" %}
                        </small>

                    </span>

                </button>


            </div>


        </div>


    </header>



    <!-- =========================================
         CATEGORY SEARCH / BROWSE
    ========================================== -->

    <section class="search-area">


        <form
            class="search-form"
            id="searchForm"
            method="GET"
            action="{% url 'search' %}"
        >


            <i class="fas fa-search"></i>



            <input
                type="search"
                id="searchInput"
                name="search"
                value="{{ request.GET.search|default:'' }}"
                placeholder="{% translate 'Search categories and products...' %}"
                autocomplete="off"
            >



            <!-- CLEAR -->

            <button
                type="button"
                id="clearSearch"
                class="clear-search"
                aria-label="{% translate 'Clear search' %}"
            >

                <i class="fas fa-times"></i>

            </button>



            <!-- SUBMIT -->

            <button
                type="submit"
                class="search-submit"
                aria-label="{% translate 'Search categories' %}"
            >

                <i class="fas fa-arrow-right"></i>

            </button>


        </form>


    </section>



    <!-- =========================================
         CONTENT
    ========================================== -->

    <main class="search-content">


        <!-- =====================================
             CATEGORIES
        ====================================== -->

                        {% translate "Browse" %}
                    </span>

            ================================== -->

<!-- =================================================
     LOGIN / REGISTER
================================================== -->

{% include 'login-container.html' %}



<!-- =================================================
     JAVASCRIPT
================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /* =================================================
           ELEMENTS
        ================================================== */

        const searchForm =
            document.getElementById("searchForm");

        const searchInput =
            document.getElementById("searchInput");

        const clearSearch =
            document.getElementById("clearSearch");

        const optionsButton =
            document.getElementById("searchOptionsButton");

        const optionsDropdown =
            document.getElementById("searchOptionsDropdown");



        /* =================================================
           CATEGORY OPTIONS
        ================================================== */

        if (optionsButton && optionsDropdown) {

            optionsButton.addEventListener(
                "click",
                function (event) {

                    event.stopPropagation();

                    optionsDropdown.classList.toggle("show");

                }
            );


            document.addEventListener(
                "click",
                function () {

                    optionsDropdown.classList.remove("show");

                }
            );


            optionsDropdown.addEventListener(
                "click",
                function (event) {

                    event.stopPropagation();

                }
            );

        }



        /* =================================================
           CLEAR SEARCH
        ================================================== */

        function updateClearButton() {

            if (!clearSearch) {
                return;
            }


            if (searchInput.value.trim() !== "") {

                clearSearch.classList.add("show");

            } else {

                clearSearch.classList.remove("show");

            }

        }


        if (searchInput) {

            searchInput.addEventListener(
                "input",
                updateClearButton
            );

        }


        if (clearSearch) {

            clearSearch.addEventListener(
                "click",
                function () {

                    searchInput.value = "";

                    searchInput.focus();

                    updateClearButton();

                }
            );

        }


        updateClearButton();



        /* =================================================
           SEARCH SUBMIT
        ================================================== */

        if (searchForm) {

            searchForm.addEventListener(
                "submit",
                function (event) {

                    const value =
                        searchInput.value.trim();


                    if (!value) {

                        event.preventDefault();

                        searchInput.focus();

                        return;

                    }


                    /*
                     * Save category/product search locally.
                     */

                    saveSearch(value);

                }
            );

        }



        /* =================================================
           POPULAR CATEGORIES
        ================================================== */

        document
            .querySelectorAll("[data-search]")
            .forEach(function (button) {

                button.addEventListener(
                    "click",
                    function () {

                        const value =
                            this.dataset.search;


                        searchInput.value = value;


                        updateClearButton();


                        saveSearch(value);


                        searchForm.submit();

                    }
                );

            });



        /* =================================================
           CATEGORY HISTORY
        ================================================== */

        const historyButton =
            document.getElementById(
                "searchHistoryButton"
            );


        if (historyButton) {

            historyButton.addEventListener(
                "click",
                function () {

                    showSearchHistory();

                }
            );

        }



        /* =================================================
           REQUEST PRODUCT
        ================================================== */

        const requestProductButton =
            document.getElementById(
                "requestProductButton"
            );


        if (requestProductButton) {

            requestProductButton.addEventListener(
                "click",
                function () {

                    /*
                     * Change this URL to your actual
                     * product-request URL if you have one.
                     */

                    window.location.href =
                        "{% url 'home' %}";

                }
            );

        }



        /* =================================================
           SEE ALL CATEGORIES
        ================================================== */

        const seeAll =
            document.getElementById(
                "seeAllCategories"
            );


        if (seeAll) {

            seeAll.addEventListener(
                "click",
                function () {

                    document
                        .querySelectorAll(
                            ".category-button"
                        )
                        .forEach(function (button) {

                            button.style.display =
                                "flex";

                        });

                }
            );

        }


    }
);



/* =========================================================
   CATEGORY HISTORY
========================================================= */

function saveSearch(value) {

    if (!value) {
        return;
    }


    let history =
        JSON.parse(
            localStorage.getItem(
                "wingastock_search_history"
            ) || "[]"
        );


    /*
     * Remove duplicate
     */

    history =
        history.filter(
            item =>
                item.toLowerCase() !==
                value.toLowerCase()
        );


    /*
     * Add newest item first
     */

    history.unshift(value);


    /*
     * Keep only last 10 items
     */

    history =
        history.slice(0, 10);


    localStorage.setItem(
        "wingastock_search_history",
        JSON.stringify(history)
    );

}



/* =========================================================
   SHOW CATEGORY HISTORY
========================================================= */

function showSearchHistory() {

    const history =
        JSON.parse(
            localStorage.getItem(
                "wingastock_search_history"
            ) || "[]"
        );


    if (!history.length) {

        alert(
            "{% translate 'You don\\'t have any recently viewed categories.' %}"
        );

        return;

    }


    const selected =
        prompt(
            "{% translate 'Recent categories:' %}\n\n" +
            history
                .map(
                    (item, index) =>
                        `${index + 1}. ${item}`
                )
                .join("\n") +
            "\n\n{% translate 'Enter a category or search term:' %}"
        );


    if (!selected) {
        return;
    }


    document.getElementById(
        "searchInput"
    ).value = selected;


    document.getElementById(
        "searchForm"
    ).submit();

}

</script>
