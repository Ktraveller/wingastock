{% load static %}

<header class="wingastock-header heading-holder-1002">

    <div class="wingastock-header-inner">

        <!-- BRAND -->
        <a href="{% url 'home' %}" class="wingastock-brand">

            <img
                src="{% static 'logo.png' %}"
                alt="Wingastock"
                class="wingastock-logo"
            >

            <span class="wingastock-title">
                Wingastock
            </span>

        </a>


        <!-- SEARCH -->
        <div class="wingastock-search">

            <i class="fas fa-search"></i>

            {% if search == 'search' %}

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search products, shops and more..."
                    autocomplete="off"
                >

            {% else %}

                <input
                    type="search"
                    placeholder="Search products, shops and more..."
                    onclick="window.location.href=`{% url 'search' %}`"
                    readonly
                >

            {% endif %}

        </div>


        <!-- ACTIONS -->
        <div class="wingastock-actions">

            <!-- CART -->
            <button
                type="button"
                class="wingastock-icon"
                onclick="open_cart(1)"
                aria-label="Shopping cart"
            >
                <i class="fas fa-shopping-cart"></i>
            </button>


            <!-- LOGIN -->
            <button
                type="button"
                class="wingastock-login"
                onclick="open_login_modal(1)"
            >
                Login
            </button>

        </div>

    </div>

</header>


<!-- ================= CART ================= -->

<div class="user-info-holder-1003" id="user_cart">

    <div>

        <button
            type="button"
            class="close-1003"
            onclick="open_cart(0)"
            aria-label="Close cart"
        >
            <i class="fas fa-times"></i>
        </button>

        <p class="cart-title">
            Your cart
        </p>

        <ul class="user-1003">

            <p class="cart-empty">

                <i class="fas fa-shopping-cart"></i>

                <br>

                Cart empty

            </p>

        </ul>

    </div>

</div>


<script>

let lastScrollTop = 0;

const header = document.querySelector('.wingastock-header');

window.addEventListener('scroll', function () {

    const currentScroll =
        window.pageYOffset ||
        document.documentElement.scrollTop;


    if (currentScroll <= 0) {

        header.classList.remove('hide-header');

        lastScrollTop = 0;

        return;

    }


    if (currentScroll > lastScrollTop) {

        header.classList.add('hide-header');

    } else {

        header.classList.remove('hide-header');

    }


    lastScrollTop = currentScroll;

});


function open_cart(click) {

    const cart = document.getElementById('user_cart');

    if (click == 1) {

        cart.style.display = 'block';

    } else {

        cart.style.display = 'none';

    }

}

</script>
