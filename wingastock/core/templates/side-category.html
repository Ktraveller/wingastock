{% load i18n %}

<div class="product-category-holder-1001">

    <div class="category-title">
        <span class="eyebrow">{% translate "Explore" %}</span>
        <h2>{% translate "Categories" %}</h2>
    </div>

    <div>

        <!-- Electronics -->
        <button class="category-chip-electronics" type="button"
            onclick="window.location.href=`{% url 'filter_products' 'electronics' %}`">
            <i class="fas fa-tv" style="color: white;"></i>
            {% translate "Electronics" as category_name %}
            <span class="category-name-1001">{{ category_name|truncatechars:15 }}</span>
        </button>

        <!-- Phones & Tablets -->
        <button class="category-chip-phones" type="button"
            onclick="window.location.href=`{% url 'filter_products' 'phones' %}`">
