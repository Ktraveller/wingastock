<article class="shop-card" onclick="window.location.href=`{% url 'shop_preview' shop.id %}`">

    <div class="shop-card-banner">

        <div class="shop-card-avatar">
            {% if shop.seller_dp %}
            <img src="{{ shop.seller_dp.url }}" alt="{{ shop.seller_name }}" class="shop-profile-image">
            {% else %}
            <i class="fas fa-store"></i>
            {% endif %}
        </div>

        <span class="shop-card-badge">
            <i class="fas fa-check-circle"></i>
            Seller
        </span>

    </div>

    <div class="shop-card-body">

        <h2>{{ shop.seller_name }}</h2>

        <p class="shop-card-description">
            {{ shop.seller_description }}
        </p>

        <div class="shop-card-meta">

            <span>
                <i class="fas fa-map-marker-alt"></i>
                {{ shop.seller_address }}
            </span>

            <span>
                <i class="fas fa-calendar-alt"></i>
                Since {{ shop.reg_date|date:"M Y" }}
            </span>

        </div>

        <div class="shop-card-footer">
            <span>View shop</span>
            <i class="fas fa-arrow-right"></i>
        </div>

    </div>

</article>


<style>
    .shop-card-avatar {
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .shop-profile-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        border-radius: inherit;
    }

    /* Keep the store icon looking correct when there is no profile picture */
    .shop-card-avatar i {
        font-size: 28px;
    }
</style>
