<article class="shop-card" onclick="window.location.href=`{% url 'shop_preview' shop.id %}`">
    <div class="shop-card-banner">
        <div class="shop-card-avatar"><i class="fas fa-store"></i></div>
        <span class="shop-card-badge"><i class="fas fa-check-circle"></i> Seller</span>
    </div>
    <div class="shop-card-body">
        <h2>{{ shop.seller_name }}</h2>
        <p class="shop-card-description">{{ shop.seller_description }}</p>
        <div class="shop-card-meta">
            <span><i class="fas fa-map-marker-alt"></i>{{ shop.seller_address }}</span>
            <span><i class="fas fa-calendar-alt"></i>Since {{ shop.reg_date|date:"M Y" }}</span>
        </div>
        <div class="shop-card-footer">
            <span>View shop</span>
            <i class="fas fa-arrow-right"></i>
        </div>
    </div>
</article>
